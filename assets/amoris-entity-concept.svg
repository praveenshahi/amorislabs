<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" fill="none">
  <defs>
    <linearGradient id="outer" x1="470" y1="170" x2="1130" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#b681ff"/><stop offset=".54" stop-color="#d2c0ff"/><stop offset="1" stop-color="#68c5ff"/></linearGradient>
    <linearGradient id="coreStroke" x1="580" y1="340" x2="1010" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#b67aff"/><stop offset="1" stop-color="#62c7ff"/></linearGradient>
    <radialGradient id="coreGlow"><stop stop-color="#b58cff" stop-opacity=".28"/><stop offset=".52" stop-color="#4f7cff" stop-opacity=".08"/><stop offset="1" stop-color="#07101d" stop-opacity="0"/></radialGradient>
    <linearGradient id="humanFace" x1="200" y1="460" x2="400" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#080a12"/><stop offset="1" stop-color="#bc84ff"/></linearGradient>
    <linearGradient id="aiFace" x1="1400" y1="460" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#080a12"/><stop offset="1" stop-color="#6bc9ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="violetArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 10 5.5 0 11" stroke="#bb87ff" stroke-width="1.5" fill="none"/></marker>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 10 5.5 0 11" stroke="#6fcaff" stroke-width="1.5" fill="none"/></marker>
  </defs>
  <rect width="1600" height="950" fill="#070910"/>
  <ellipse cx="800" cy="456" rx="440" ry="350" fill="url(#coreGlow)"/>
  <ellipse cx="800" cy="456" rx="295" ry="268" stroke="#9b73d6" stroke-opacity=".11" filter="url(#blur)"/>

  <!-- Human and AI are contextual fields, not decorative characters -->
  <path d="M125 192C278 193 390 286 399 394c5 61-29 89-64 108 35 24 51 63 39 130-13 76-75 144-177 157" stroke="url(#humanFace)" stroke-width="2.4" opacity=".9"/>
  <path d="M138 233c101 24 169 84 177 157 5 42-22 67-72 83 45 16 68 52 58 105-10 53-59 91-148 107" stroke="#a975ef" stroke-width="1" stroke-opacity=".35" stroke-dasharray="2 8"/>
  <path d="M1475 192c-153 1-265 94-274 202-5 61 29 89 64 108-35 24-51 63-39 130 13 76 75 144 177 157" stroke="url(#aiFace)" stroke-width="2.4" opacity=".9"/>
  <path d="M1462 233c-101 24-169 84-177 157-5 42 22 67 72 83-45 16-68 52-58 105 10 53 59 91 148 107" stroke="#69c5fb" stroke-width="1" stroke-opacity=".35" stroke-dasharray="2 8"/>

  <text x="252" y="505" fill="#F1ECFA" font-family="Arial, sans-serif" font-size="22" font-weight="700">Human</text>
  <text x="252" y="534" fill="#C1B7D3" font-family="Arial, sans-serif" font-size="20">evolves</text>
  <text x="1349" y="505" fill="#F1ECFA" font-family="Arial, sans-serif" font-size="22" font-weight="700">AI</text>
  <text x="1349" y="534" fill="#C1B7D3" font-family="Arial, sans-serif" font-size="20">evolves</text>
  <g fill="#9993A8" font-family="Arial, sans-serif" font-size="14"><text x="244" y="574">Knowledge</text><text x="244" y="599">Judgment</text><text x="244" y="624">Expertise</text><text x="244" y="649">Context</text><text x="244" y="674">Intent</text><text x="1338" y="574">Behavior</text><text x="1338" y="599">Confidence</text><text x="1338" y="624">Planning</text><text x="1338" y="649">Memory</text><text x="1338" y="674">Tools</text></g>

  <!-- The adaptive loop -->
  <path d="M690 198C539 246 481 381 512 526" stroke="url(#outer)" stroke-width="2" marker-end="url(#violetArrow)"/>
  <path d="M910 198c151 48 209 183 178 328" stroke="url(#outer)" stroke-width="2" marker-end="url(#blueArrow)"/>
  <path d="M1088 526c-43 126-134 201-278 218" stroke="url(#outer)" stroke-width="2" marker-end="url(#blueArrow)"/>
  <path d="M512 526c43 126 134 201 278 218" stroke="url(#outer)" stroke-width="2" marker-end="url(#violetArrow)"/>
  <path d="M690 198C539 246 481 381 512 526" stroke="#b67eff" stroke-width="7" opacity=".13" filter="url(#soft)"/>
  <path d="M910 198c151 48 209 183 178 328" stroke="#66c7ff" stroke-width="7" opacity=".13" filter="url(#soft)"/>

  <!-- Human state -->
  <g transform="translate(753 76)"><circle cx="47" cy="47" r="46" fill="#0B0D17" stroke="#b88aff" stroke-width="2"/><circle cx="47" cy="34" r="10" stroke="#D2B7FF" stroke-width="2"/><path d="M28 66c4-13 12-19 19-19s15 6 19 19" stroke="#D2B7FF" stroke-width="2" stroke-linecap="round"/><text x="47" y="-16" text-anchor="middle" fill="#F4F1FA" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">HUMAN</text></g>
  <path d="M800 170v85" stroke="#84789D" stroke-width="1" stroke-dasharray="3 8"/>

  <!-- Interaction layer -->
  <g transform="translate(580 290)"><rect width="440" height="230" rx="115" fill="#0A0E1A" stroke="url(#coreStroke)" stroke-width="2.2"/><rect x="10" y="10" width="420" height="210" rx="105" stroke="#A67EE4" stroke-opacity=".28"/><circle cx="220" cy="115" r="94" stroke="url(#coreStroke)" stroke-opacity=".32"/><circle cx="220" cy="115" r="54" stroke="#B890FF" stroke-opacity=".16"/><text x="220" y="94" text-anchor="middle" fill="#F7F5FB" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">AMORIS</text><text x="220" y="126" text-anchor="middle" fill="#F7F5FB" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2">INTERACTION LAYER</text><text x="220" y="165" text-anchor="middle" fill="#C9C4D6" font-family="Arial, sans-serif" font-size="16">Observes · Learns · Adapts</text><text x="220" y="190" text-anchor="middle" fill="#C9C4D6" font-family="Arial, sans-serif" font-size="16">Guides · Captures Evidence</text></g>

  <!-- AI systems -->
  <path d="M800 520v84" stroke="#84789D" stroke-width="1" stroke-dasharray="3 8"/>
  <g transform="translate(753 607)"><circle cx="47" cy="47" r="46" fill="#0B0D17" stroke="#70CAFF" stroke-width="2"/><path d="m31 37 16-9 16 9v19l-16 9-16-9zM31 37l16 9 16-9M47 46v19" stroke="#9EDBFF" stroke-width="2" stroke-linejoin="round"/><text x="47" y="119" text-anchor="middle" fill="#F4F1FA" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">AI SYSTEMS</text></g>

  <!-- Both evolving fields resolve into decisions -->
  <path d="M336 702v73c0 28 22 50 50 50h355" stroke="#A782D7" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="3 8"/>
  <path d="M1264 702v73c0 28-22 50-50 50H859" stroke="#6CBDE8" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="3 8"/>
  <circle cx="800" cy="825" r="27" fill="#0B0D17" stroke="#858093"/><path d="M788 831h24M791 824l7-8 7 8" stroke="#E0DDE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="883" text-anchor="middle" fill="#F7F5FB" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">BETTER DECISIONS</text>
</svg>
